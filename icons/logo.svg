<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ICC NEXIS">
  <defs>
    <linearGradient id="nexis-latar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4fd6"/>
      <stop offset=".55" stop-color="#0b95f0"/>
      <stop offset="1" stop-color="#22c7a9"/>
    </linearGradient>
    <radialGradient id="nexis-kilau" cx=".25" cy=".15" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#nexis-latar)"/>
  <rect width="100" height="100" rx="24" fill="url(#nexis-kilau)"/>
  <!-- N dibentuk daripada nod rangkaian yang bersambung -->
  <path d="M30 71V29l40 42V29" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
  <g fill="#fff">
    <circle cx="30" cy="71" r="7.5"/><circle cx="30" cy="29" r="7.5"/>
    <circle cx="70" cy="71" r="7.5"/><circle cx="70" cy="29" r="7.5"/>
  </g>
  <!-- Nod pusat: "percikan" penghubung -->
  <circle cx="50" cy="50" r="7" fill="#ffd166" stroke="#fff" stroke-width="3"/>
</svg>
